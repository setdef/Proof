# The gate (`bundle exec rake`) on Linux and macOS, for every push to trunk.
# Windows joins when mise.toml installs Ruby there.
name: CI

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

# Every push to trunk gets a run of its own, and nothing cancels it. A group
# shared by all of trunk's runs leaves one run going and one waiting, and a
# newer push cancels the waiting run even with cancel-in-progress off, so
# under frequent pushes almost no run finished. Here a trunk run's group is its
# commit, so runs go side by side and every commit's run finishes. A run of
# any other ref (a manual dispatch) still shares its ref's group, where a
# newer run cancels the older one, which does no harm there.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/trunk' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

defaults:
  run:
    shell: bash

env:
  # mise installs Ruby from jdx/ruby's precompiled builds. false makes a
  # missing build fail the job, where mise would otherwise compile Ruby from
  # source.
  MISE_RUBY_COMPILE: "false"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"

jobs:
  gate:
    name: Gate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise.toml pins the tools contributors use: Ruby, the REUSE tool, and
      # usage. CI installs the same pins.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      - name: Install the bundle
        run: bundle install

      - name: Run the gate
        run: bundle exec rake
