version = 1

# An SPDX header is only for a file copied under a copyleft or share-alike
# license. This file declares the copyright and license of every other file:
# Proof's own, under MIT and CC-BY-4.0, and any copied under a permissive or
# public-domain license. Where two entries match a file, the later one wins,
# and a header inside a file wins over both.

# Code and configuration: every file no later entry matches.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "MIT"

# Documentation: every page, including the generated CLI references and the
# Agent Skill's pages.
[[annotations]]
path = ["**/*.md", "**/*.txt", "**/*.rdoc"]
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "CC-BY-4.0"

# A file copied under a public-domain license, so it has no header.
[[annotations]]
path = ".pre-commit-config.yaml"
SPDX-FileCopyrightText = "2020 Free Software Foundation Europe e.V."
SPDX-License-Identifier = "CC0-1.0"

# usage's argv conformance corpus, copied from the corpus folder of usage's
# repository at the tag v7.4.1, with a `spec_json` field added to each vector.
# usage's LICENSE at that tag is MIT, with the copyright below.
[[annotations]]
path = "gems/usage-rb/test/corpus/vectors/**"
SPDX-FileCopyrightText = ["2025 Jeff Dickey", "2026 setdef <kerrick@setdef.com>"]
SPDX-License-Identifier = "MIT"
