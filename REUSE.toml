version = 1

# No file carries an SPDX header, because MIT and CC-BY-4.0 aren't copyleft or
# share-alike licenses. This file declares each file's copyright and license.
# Where two entries match a file, the later one wins, and a header inside a
# file wins over both.

# Code and configuration: every file no later entry matches.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "MIT"

# Documentation: every page, including the generated CLI references and the
# Agent Skill's pages.
[[annotations]]
path = ["**/*.md", "**/*.txt", "**/*.rdoc"]
SPDX-FileCopyrightText = "2026 setdef <kerrick@setdef.com>"
SPDX-License-Identifier = "CC-BY-4.0"
