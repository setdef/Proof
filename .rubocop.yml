# URL pin. The baseline lives in ruby_quality's config/rubocop.yml and is
# fetched at lint time, so rule changes propagate with no per-repo sync.
# Works in CI and contributor clones (bundler already needs network).

inherit_from:
  - https://raw.githubusercontent.com/Kerrick/ruby_quality/main/config/rubocop.yml

# Makes this repository RuboCop's project root, wherever the checkout sits.
require:
  - ./tasks/rubocop_project_root.rb

plugins:
  - rubocop-performance
  - rubocop-minitest
  - rubocop-rake
  - rubocop-thread_safety
  - rubocop-packaging
  - rubocop-md
  - rubocop-on-rbs

AllCops:
  # The baseline sets DisabledByDefault: true, and RuboCop refuses both
  # settings at once.
  DisabledByDefault: false
  EnabledByDefault: true
  NewCops: enable
  TargetRubyVersion: "4.1"
  Exclude:
    - "tmp/**/*"
    - "vendor/**/*"

Markdown:
  # Lint only code blocks tagged ruby. With autodetection on, rubocop-md
  # parses the console and shell blocks in the docs as Ruby.
  Autodetect: false

Style/EndlessMethod:
  # documentation_style.md bans endless methods, since RDoc misreads them.
  EnforcedStyle: disallow

Style/Copyright:
  # Proof's files carry no headers, because REUSE.toml declares their licenses.
  Enabled: false

Lint/ConstantResolution:
  # RuboCop's docs say enabling this disables Style/RedundantConstantBase.
  Enabled: false

Style/MissingElse:
  # RuboCop's docs say this conflicts with Style/EmptyElse's default style.
  Enabled: false

Markdown/Syntax:
  # Kramdown doesn't know GitHub's alert syntax, which the docs use for
  # warnings, so it reports each "> [!warning]" line as an undefined link. No
  # Markdown satisfies both this cop and those alerts.
  Enabled: false

Style/DataInheritance:
  # The form this cop wants, Foo = Data.define(...) do ... end, is a constant to
  # RDoc: it never sees the methods in the block, so the coverage check doesn't
  # count them. A constant defined in the block also lands in the enclosing
  # namespace. The class form costs one unnamed superclass.
  Enabled: false

Style/Documentation:
  inherit_mode:
    merge:
      - Exclude
  # The documentation of lib/ lives in sig/**/*.rbs, so a class or module in
  # lib/ carries no comment. The docs:placement task fails on one that does.
  # The same holds for the lib/ of each gem under gems/.
  Exclude:
    - "lib/**/*.rb"
    - "gems/*/lib/**/*.rb"

Style/DocumentationMethod:
  inherit_mode:
    merge:
      - Exclude
  # Same reason as Style/Documentation: lib/'s methods are documented in sig/.
  Exclude:
    - "lib/**/*.rb"
    - "gems/*/lib/**/*.rb"

Style/InlineComment:
  # A Markdown page shows a result as `expression # => value`, a trailing
  # comment that the docs:examples task checks. Steep reads a type assertion
  # from a trailing comment, `value #: String`, which is the only place it
  # takes one.
  Exclude:
    - "**/*.md"
    - "lib/**/*.rb"
    - "gems/*/lib/**/*.rb"

ThreadSafety/NewThread:
  inherit_mode:
    merge:
      - Exclude
  # A contract module checks a store under two threads at once, as
  # architecture.md requires of every store, so it starts the threads.
  Exclude:
    - "gems/proof-domain/lib/proof/testing/**/*.rb"
    # The test of the busy handler holds the file's write lock in one thread, counts the ticks of a second while a
    # third waits for the lock, and needs the three at once.
    - "test/sqlite_runs_races_test.rb"
    # The server's tests run the server in a thread with a fiber scheduler of its own, and call it from others, as the
    # command and the runners call it from other processes.
    - "test/server_https_client.rb"
    - "test/server_https_test.rb"
    - "test/server_root_test.rb"
    - "test/server_serve_test.rb"

Style/IpAddresses:
  # Tests never reach the internet, so a server a test starts listens on the loopback address alone.
  AllowedAddresses:
    - "::"
    - "127.0.0.1"

Style/StringHashKeys:
  # A Rack application takes its request as a hash with string keys, and answers with headers in one, as the Rack
  # specification says, and the server's requests and their tests are written to it.
  Exclude:
    - "lib/proof/server/requests.rb"
    - "lib/proof/server/root.rb"
    - "test/server_https_test.rb"
    - "test/server_requests_test.rb"
    - "test/server_root_test.rb"
