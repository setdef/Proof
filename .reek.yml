---
detectors:
  IrresponsibleModule:
    # Reek wants a comment above each class and module in lib/. The
    # documentation of lib/ lives in sig/**/*.rbs, and a comment above a
    # definition in a .rb file fails the docs:placement check.
    enabled: false
  UncommunicativeVariableName:
    # RuboCop's Naming/RescuedExceptionsVariableName wants the variable of a
    # rescue to be e, and its Lint/UnusedBlockArgument wants _ for a block
    # argument that goes unused. Reek wants a longer name for any single letter.
    accept:
      - e
      - _
  ModuleInitialize:
    # Each fact of a run is a Data.define class, and two Data.define classes
    # can't share a superclass. The check every fact makes of its time sits in
    # the module they all include, which calls Data's initialize.
    exclude:
      - Proof::Run::Fact
