repos:
  - repo: local
    hooks:
      -   id: bundle-check
          name: Check Gemfile.lock
          entry: bundle check
          language: system
          files: (Gemfile|Gemfile\.lock|proof\.gemspec)
          pass_filenames: false
      -   id: rake
          name: rake
          entry: bundle exec rake
          language: system
          pass_filenames: false
